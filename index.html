<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Victoria's Skeletal Labeling Game - Precision Pin Edition</title>
<style>
:root{--navy:#334a7d;--navy2:#233762;--ink:#20242b;--muted:#667085;--good:#16a34a;--bad:#dc2626;--gold:#f59e0b;--sky:#0ea5e9;--panel:#fff;--bg:#eef2f8}
*{box-sizing:border-box} body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--ink)}
.top{position:sticky;top:0;z-index:50;background:linear-gradient(90deg,var(--navy2),var(--navy));color:white;box-shadow:0 2px 8px #0002}
.topin{max-width:1500px;margin:auto;padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}.brand{font-weight:900;font-size:1.1rem;margin-right:auto}.modebar{display:flex;gap:7px;flex-wrap:wrap}.mode{border:1px solid #ffffff55;background:#ffffff18;color:#fff;border-radius:999px;padding:8px 12px;font-weight:800;cursor:pointer}.mode.on{background:#fff;color:var(--navy2)}
.page{max-width:1500px;margin:auto;padding:18px;display:grid;grid-template-columns:minmax(500px,880px) minmax(310px,1fr);gap:18px}@media(max-width:1050px){.page{grid-template-columns:1fr}}
.card{background:#fff;border-radius:18px;box-shadow:0 14px 35px #22304f18;border:1px solid #d9e1ef;overflow:hidden}.promptbar{background:#f7f9fc;border-bottom:1px solid #dbe3ef;padding:13px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.promptbar strong{font-size:1.15rem}.pill{padding:7px 11px;border-radius:999px;background:#e9effc;color:#253b70;font-weight:800}.pill.good{background:#dcfce7;color:#166534}.pill.bad{background:#fee2e2;color:#991b1b}
.skeletonwrap{position:relative;background:#fff;overflow:auto;max-height:calc(100vh - 165px);min-height:600px}.canvas{position:relative;width:min(820px,100%);aspect-ratio:820/1850;margin:0 auto;background:white}.skeleton{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;user-select:none;pointer-events:none}
.pin{position:absolute;width:19px;height:19px;border-radius:50%;border:2px solid #3d4652;background:#fff;transform:translate(-50%,-50%);cursor:pointer;box-shadow:0 1px 4px #0003;z-index:3;transition:.12s}.pin:hover{transform:translate(-50%,-50%) scale(1.28);border-color:var(--sky)}.pin.selected{background:#dbeafe;border-color:#2563eb;box-shadow:0 0 0 5px #60a5fa33}.pin.correct{background:#bbf7d0;border-color:#15803d}.pin.wrong{background:#fecaca;border-color:#b91c1c}.pin.target{background:#fef3c7;border-color:#d97706;box-shadow:0 0 0 7px #f59e0b22;animation:pulse 1s infinite}@keyframes pulse{50%{box-shadow:0 0 0 12px #f59e0b08}}
.pin.num::after{content:attr(data-num);position:absolute;left:22px;top:-6px;background:#fff;color:#334155;border:1px solid #cbd5e1;border-radius:8px;padding:2px 5px;font-size:10px;font-weight:800;white-space:nowrap}
.side{padding:16px;display:flex;flex-direction:column;gap:13px}.section{border:1px solid #dfe7f2;border-radius:15px;padding:14px;background:#fbfdff}.section h2,.section h3{margin:0 0 8px}.small{color:var(--muted);font-size:.91rem;line-height:1.45}.msg{padding:10px 12px;border-radius:12px;font-weight:800}.msg.info{background:#eff6ff;color:#1d4ed8}.msg.good{background:#ecfdf5;color:#166534}.msg.bad{background:#fef2f2;color:#991b1b}
.btn{border:0;border-radius:12px;padding:10px 13px;font-weight:800;cursor:pointer;background:#e9effc;color:#253b70}.btn.primary{background:linear-gradient(135deg,#334a7d,#5b6fb2);color:#fff}.btn.good{background:#dcfce7;color:#166534}.btn.danger{background:#fee2e2;color:#991b1b}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}input[type=text]{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:12px;font:inherit}.bank{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:8px 10px;border:1px solid #b9c6e3;border-radius:999px;background:#eef3ff;color:#2b3f72;font-weight:800;cursor:grab}.chip.sel{outline:3px solid #38bdf833}.chip.done{background:#dcfce7;border-color:#86efac;color:#166534;cursor:default}.chip.dragging{opacity:.45}
.flash{min-height:260px;border-radius:18px;background:linear-gradient(145deg,#2d4578,#5c6ea6);color:white;display:flex;align-items:center;justify-content:center;text-align:center;padding:22px;cursor:pointer;position:relative}.flash .big{font-size:2rem;font-weight:900}.flash.back{background:#fff;color:#1f2937;border:1px solid #d7e0ee}.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:9px}.g{padding:10px;border-radius:12px;border:1px solid #e2e8f0;background:#fff}.g strong{color:#2c4073}.legend{display:flex;gap:10px;flex-wrap:wrap}.legend span{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;color:#475569}.dot{width:13px;height:13px;border-radius:50%;border:2px solid #3d4652;background:#fff}.dot.g{background:#bbf7d0;border-color:#15803d}.dot.r{background:#fecaca;border-color:#b91c1c}.dot.y{background:#fef3c7;border-color:#d97706}
.footnote{font-size:.82rem;color:#667085;line-height:1.45}.zoomCtl{margin-left:auto;display:flex;gap:6px}.zoomCtl button{background:#fff;color:#253b70;border:1px solid #cad5e7;border-radius:9px;padding:6px 9px;font-weight:900;cursor:pointer}
</style>
</head>

const W=820,H=1850;
const state={mode:'learn',score:0,msg:null,selected:null,locateOrder:[],locateIndex:0,typeOrder:[],typeIndex:0,typeSolved:new Set(),dragSet:[],dragSolved:new Set(),dragSelected:null,flashIndex:0,flashBack:false,numberPins:false,zoom:1};
const side=document.getElementById('side'), pins=document.getElementById('pins'), canvas=document.getElementById('canvas'), scrollbox=document.getElementById('scrollbox');
const promptTitle=document.getElementById('promptTitle'),scorePill=document.getElementById('scorePill'),progressPill=document.getElementById('progressPill');
const modes=[['learn','Explore'],['locate','Click-the-Bone'],['type','Type the Name'],['drag','Drag & Drop'],['flash','Flashcards'],['list','Study List']];
function shuf(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function norm(s){return (s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim().replace(/\s+/g,' ')}
function get(id){return bones.find(b=>b.id===id)}
function ok(text,b){let n=norm(text);return b.accept.some(x=>norm(x)===n)||norm(b.name)===n}
function msg(type,text){state.msg=text?{type,text}:null;renderSide()}
function modeButtons(){let el=document.getElementById('modebar');el.innerHTML='';modes.forEach(([id,label])=>{let b=document.createElement('button');b.className='mode '+(state.mode===id?'on':'');b.textContent=label;b.onclick=()=>switchMode(id);el.appendChild(b)})}
function switchMode(m){state.mode=m;state.msg=null;state.selected=null;state.score=0;if(m==='locate'){state.locateOrder=shuf(bones.map(b=>b.id));state.locateIndex=0}if(m==='type'){state.typeOrder=shuf(bones.map(b=>b.id));state.typeIndex=0;state.typeSolved=new Set()}if(m==='drag'){newDragRound(12)}if(m==='flash'){state.flashIndex=0;state.flashBack=false}modeButtons();render()}
function newDragRound(n){state.dragSet=shuf(bones.map(b=>b.id)).slice(0,n);state.dragSolved=new Set();state.dragSelected=null;state.score=0}
function activeType(){return get(state.typeOrder[state.typeIndex])}
function activeLocate(){return get(state.locateOrder[state.locateIndex])}
function pinClass(b){let c='pin';if(state.numberPins)c+=' num';if(state.selected===b.id)c+=' selected';if(state.mode==='type'&&activeType()?.id===b.id)c+=' target';if(state.dragSolved.has(b.id))c+=' correct';if(state.typeSolved.has(b.id))c+=' correct';return c}
function renderPins(){pins.innerHTML='';bones.forEach((b,i)=>{let p=document.createElement('button');p.className=pinClass(b);p.style.left=(b.x/W*100)+'%';p.style.top=(b.y/H*100)+'%';p.dataset.id=b.id;p.dataset.num=i+1;p.setAttribute('aria-label',state.mode==='learn'?b.name:'bone marker');p.draggable=false;p.onclick=()=>clickPin(b.id,p);p.ondragover=e=>{if(state.mode==='drag'&&!state.dragSolved.has(b.id)){e.preventDefault();p.classList.add('selected')}};p.ondragleave=()=>p.classList.remove('selected');p.ondrop=e=>{if(state.mode!=='drag')return;e.preventDefault();p.classList.remove('selected');let id=e.dataTransfer.getData('text/plain');if(id)dragAttempt(id,b.id)};pins.appendChild(p)})}
function flashPin(id,good){document.querySelectorAll('.pin[data-id="'+id+'"]').forEach(p=>{p.classList.add(good?'correct':'wrong');setTimeout(()=>p.classList.remove(good?'correct':'wrong'),500)})}
function clickPin(id,p){let b=get(id);if(state.mode==='learn'||state.mode==='list'){state.selected=id;msg('info','<strong>'+b.name+'</strong><br>'+b.hint);renderPins();return}if(state.mode==='locate'){let a=activeLocate();if(!a)return;if(id===a.id){state.score++;flashPin(id,true);state.locateIndex++;state.msg={type:'good',text:'✅ Correct - '+a.name};if(state.locateIndex>=bones.length){state.msg={type:'good',text:'🎉 All 35 complete!'};}setTimeout(render,350)}else{flashPin(id,false);state.msg={type:'bad',text:'❌ That marker is '+b.name+'. Try again.'};renderSide()}return}if(state.mode==='drag'){if(state.dragSelected)dragAttempt(state.dragSelected,id);else msg('info','Choose a word from the bank first.')}}
function dragAttempt(wordId,pinId){let word=get(wordId),target=get(pinId);if(wordId===pinId){state.dragSolved.add(wordId);state.dragSelected=null;state.score++;state.msg={type:'good',text:'✅ '+word.name+' placed correctly.'};}else state.msg={type:'bad',text:'❌ '+word.name+' does not belong on that marker.'};render()}
function checkType(){let b=activeType(),inp=document.getElementById('typeInput');if(!b||!inp)return;if(ok(inp.value,b)){state.typeSolved.add(b.id);state.score++;state.msg={type:'good',text:'✅ '+b.name};state.typeIndex++;if(state.typeIndex>=bones.length){state.msg={type:'good',text:'🎉 You typed all 35 bones correctly!'};}render()}else{state.msg={type:'bad',text:'❌ Not quite. Try that highlighted marker again.'};renderSide();inp.select()}}
function renderHeader(){scorePill.textContent='Score '+state.score;let p='';if(state.mode==='learn')p=state.selected?'Selected: '+get(state.selected).name:'Click any small circle to reveal the bone';if(state.mode==='locate')p=activeLocate()?'Click on '+activeLocate().name:'Click-the-Bone complete!';if(state.mode==='type')p=activeType()?'Type the name of the highlighted marker':'Type-the-Name complete!';if(state.mode==='drag')p='Drag each word onto the correct small circle';if(state.mode==='flash')p='Flashcard '+(state.flashIndex+1)+' of 35';if(state.mode==='list')p='All 35 bones';promptTitle.textContent=p;let n=0;if(state.mode==='locate')n=state.locateIndex;if(state.mode==='type')n=state.typeIndex;if(state.mode==='drag')n=state.dragSolved.size;if(state.mode==='flash')n=state.flashIndex+1;if(state.mode==='learn'||state.mode==='list')n=35;progressPill.textContent=n+' / 35'}
function messageHTML(){return state.msg?'<div class="msg '+state.msg.type+'">'+state.msg.text+'</div>':''}
function renderSide(){let h='';if(state.mode==='learn'){let b=state.selected?get(state.selected):null;h=`<div class="section"><h2>Explore</h2><p class="small">These are now true <strong>point markers</strong>, not broad hit boxes. Click a circle to reveal exactly what it represents.</p>${messageHTML()}</div><div class="section"><h3>${b?b.name:'Pick a marker'}</h3><p>${b?b.hint:'Use this first to learn where the markers are.'}</p><div class="row"><button class="btn" id="numbers">${state.numberPins?'Hide':'Show'} marker numbers</button></div></div><div class="section"><div class="legend"><span><i class="dot"></i> normal</span><span><i class="dot g"></i> correct</span><span><i class="dot r"></i> wrong</span><span><i class="dot y"></i> active</span></div></div>`}
if(state.mode==='locate'){let b=activeLocate();h=`<div class="section"><h2>Click-the-Bone</h2><p class="small">Like your example: read the prompt, then click the precise circle on the skeleton. No big selectable regions.</p>${messageHTML()}</div>${b?`<div class="section"><h3>Find: ${b.name}</h3><p class="small">No location hint is shown in this mode.</p></div>`:`<div class="section"><h2>🎉 Complete</h2><p>Final score: <strong>${state.score}/35</strong></p><button class="btn primary" id="again">Play again</button></div>`}`}
if(state.mode==='type'){let b=activeType();h=`<div class="section"><h2>Type the Name</h2><p class="small">The active circle pulses gold. Victoria types the bone name instead of choosing it.</p>${messageHTML()}</div>${b?`<div class="section"><h3>What bone is this?</h3><p class="small">Look at the highlighted marker on the skeleton.</p><input id="typeInput" type="text" autocomplete="off" placeholder="Type bone name"><div style="height:8px"></div><button class="btn primary" id="checkType">Check</button></div>`:`<div class="section"><h2>🎉 Complete</h2><p>Score: <strong>${state.score}/35</strong></p><button class="btn primary" id="typeAgain">Start over</button></div>`}`}
if(state.mode==='drag'){h=`<div class="section"><h2>Drag & Drop</h2><p class="small">Drag a word onto a precise circle. On phones/tablets, tap a word and then tap the circle.</p>${messageHTML()}<div class="row"><button class="btn" data-size="8">8 bones</button><button class="btn" data-size="12">12 bones</button><button class="btn" data-size="20">20 bones</button><button class="btn" data-size="35">All 35</button></div></div><div class="section"><h3>Word Bank</h3><div class="bank">${state.dragSet.map(id=>{let b=get(id),d=state.dragSolved.has(id);return `<span class="chip ${d?'done':''} ${state.dragSelected===id?'sel':''}" draggable="${d?'false':'true'}" data-word="${id}">${b.name}</span>`}).join('')}</div></div>`}
if(state.mode==='flash'){let b=bones[state.flashIndex];h=`<div class="section"><h2>Flashcards</h2><p class="small">Try to picture the marker location before flipping.</p></div><div class="flash ${state.flashBack?'back':''}" id="flashcard">${state.flashBack?`<div><div class="big">${b.name}</div><p>${b.hint}</p><button class="btn good" id="showPin">Show on skeleton</button></div>`:`<div><div class="small" style="color:#dbeafe">Where is this bone?</div><div class="big">${b.name}</div><p>Click card to reveal hint</p></div>`}</div><div class="row"><button class="btn" id="prev">◀ Prev</button><button class="btn primary" id="flip">Flip</button><button class="btn" id="next">Next ▶</button></div>`}
if(state.mode==='list'){let groups={};bones.forEach(b=>(groups[b.group]??=[]).push(b));h=`<div class="section"><h2>Study List</h2><p class="small">Your updated 35-bone set, grouped for review.</p>${messageHTML()}</div><div class="groups">${Object.entries(groups).map(([g,arr])=>`<div class="g"><strong>${g}</strong><div class="small">${arr.map(b=>`<button class="btn" style="width:100%;margin-top:5px;text-align:left" data-jump="${b.id}">${b.name}</button>`).join('')}</div></div>`).join('')}</div>`}
side.innerHTML=h;bindSide()}
function bindSide(){document.getElementById('numbers')?.addEventListener('click',()=>{state.numberPins=!state.numberPins;render()});document.getElementById('again')?.addEventListener('click',()=>switchMode('locate'));document.getElementById('typeAgain')?.addEventListener('click',()=>switchMode('type'));document.getElementById('checkType')?.addEventListener('click',checkType);document.getElementById('typeInput')?.addEventListener('keydown',e=>{if(e.key==='Enter')checkType()});document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{newDragRound(+b.dataset.size);render()});document.querySelectorAll('[data-word]').forEach(c=>{let id=c.dataset.word;if(state.dragSolved.has(id))return;c.onclick=()=>{state.dragSelected=state.dragSelected===id?null:id;render()};c.ondragstart=e=>{state.dragSelected=id;c.classList.add('dragging');e.dataTransfer.setData('text/plain',id)};c.ondragend=()=>c.classList.remove('dragging')});document.getElementById('flashcard')?.addEventListener('click',e=>{if(e.target.id==='showPin')return;state.flashBack=!state.flashBack;renderSide()});document.getElementById('flip')?.addEventListener('click',()=>{state.flashBack=!state.flashBack;renderSide()});document.getElementById('prev')?.addEventListener('click',()=>{state.flashIndex=(state.flashIndex+34)%35;state.flashBack=false;state.selected=null;render()});document.getElementById('next')?.addEventListener('click',()=>{state.flashIndex=(state.flashIndex+1)%35;state.flashBack=false;state.selected=null;render()});document.getElementById('showPin')?.addEventListener('click',()=>{state.selected=bones[state.flashIndex].id;renderPins()});document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{state.selected=b.dataset.jump;state.msg={type:'info',text:'<strong>'+get(b.dataset.jump).name+'</strong><br>'+get(b.dataset.jump).hint};render()});}
function render(){renderHeader();renderPins();renderSide();setTimeout(()=>{if(state.mode==='type')document.getElementById('typeInput')?.focus()},0)}
function applyZoom(){canvas.style.width=(Math.min(820,820*state.zoom))+'px';document.getElementById('zoomReset').textContent=Math.round(state.zoom*100)+'%'}
document.getElementById('zoomIn').onclick=()=>{state.zoom=Math.min(1.8,state.zoom+.15);applyZoom()};document.getElementById('zoomOut').onclick=()=>{state.zoom=Math.max(.75,state.zoom-.15);applyZoom()};document.getElementById('zoomReset').onclick=()=>{state.zoom=1;applyZoom()};
modeButtons();state.locateOrder=shuf(bones.map(b=>b.id));state.typeOrder=shuf(bones.map(b=>b.id));newDragRound(12);render();
</script>
</body></html>
